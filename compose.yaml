## Runtime-only compose (for Electron installer workflows)
services:
  axiom_runtime:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      ENABLE_PY: 0
      TELEMETRY_BASE_URL: ""  # e.g. http://192.168.86.31:8080
      NODE_ENV: production
      HMI_AUTH_BYPASS: "1"
    restart: unless-stopped