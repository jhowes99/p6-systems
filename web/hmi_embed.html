<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>HMI — P6 Systems</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="site.css" />
    <link rel="stylesheet" href="app_shell.css" />
    <style>
      .hmiWrap{ height: calc(100vh - 140px); display:grid; }
      .frameBox{
        position: relative;
        border: 1px solid rgba(15,23,42,.12);
        border-radius: 16px;
        overflow: hidden;
        background: rgba(255,255,255,.92);
        box-shadow: 0 10px 24px rgba(2,6,23,.10);
      }
      iframe{ width: 100%; height: 100%; border: 0; display:block; }
      .spinner{
        position:absolute; inset: 0;
        display:flex; align-items:center; justify-content:center;
        background: linear-gradient(180deg, rgba(244,246,248,.88), rgba(244,246,248,.72));
        backdrop-filter: blur(6px);
        z-index: 2;
      }
      .spinCard{
        width: min(520px, 92%);
        border: 1px solid rgba(15,23,42,.12);
        border-radius: 16px;
        background: rgba(255,255,255,.96);
        padding: 16px;
        display:grid;
        gap: 10px;
      }
      .bar{
        height: 10px;
        border-radius: 999px;
        background: rgba(31,58,95,.10);
        overflow:hidden;
        border: 1px solid rgba(31,58,95,.18);
      }
      .bar > div{
        height: 100%;
        width: 45%;
        background: linear-gradient(90deg, rgba(47,93,138,.25), rgba(47,93,138,.85), rgba(47,93,138,.25));
        animation: load 1.1s ease-in-out infinite;
      }
      @keyframes load{ 0%{ transform: translateX(-100%);} 100%{ transform: translateX(220%);} }
      .row{ display:flex; gap: 10px; flex-wrap: wrap; align-items:center; justify-content: space-between; }
    </style>
  </head>
  <body data-app-active="hmi">
    <div id="appShell"></div>

    <main class="wrap">
      <div class="row" style="margin-bottom:12px;">
        <div>
          <h1 style="margin:0;">HMI</h1>
          <div class="small">Embedded as same-origin iframe to avoid third‑party cookie issues.</div>
        </div>
        <a class="btn secondary" href="/scada/" target="_blank" rel="noreferrer">Open HMI in new tab</a>
      </div>

      <div class="hmiWrap">
        <div class="frameBox">
          <div id="spinner" class="spinner">
            <div class="spinCard">
              <div style="font-weight:950;">Loading HMI…</div>
              <div class="small">If it takes too long, open it in a new tab.</div>
              <div class="bar"><div></div></div>
              <div class="small" id="spinErr" style="display:none; color:#9a3412;"></div>
              <div class="row">
                <span class="badge dot safety">Safety stays visible</span>
                <a class="btn" href="/scada/" target="_blank" rel="noreferrer">Open now</a>
              </div>
            </div>
          </div>
          <!-- Go straight to WebStation to avoid the Apache default root page and redirect loops -->
          <iframe id="hmiFrame" src="/scada" title="HMI"></iframe>
        </div>
      </div>
    </main>

    <script src="app_shell.js"></script>
    <script>
      (function(){
        const frame = document.getElementById("hmiFrame");
        const spinner = document.getElementById("spinner");
        const err = document.getElementById("spinErr");
        let shownErr = false;
        const t = setTimeout(() => {
          shownErr = true;
          err.style.display = "block";
          err.textContent = "Still loading… check login, HMI container health, or open in a new tab.";
        }, 6000);
        frame.addEventListener("load", () => {
          clearTimeout(t);
          spinner.style.display = "none";
        });
        // If the iframe fails hard (network), browsers won't always fire "error". We keep the fallback visible.
        if (!shownErr) err.style.display = "none";
      })();
    </script>
  </body>
</html>
