<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>P6 Tag Mapping</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="site.css" />
  <link rel="stylesheet" href="app_shell.css" />
  <link rel="stylesheet" href="ui.css" />
</head>
<body data-app-active="tags">
  <div id="appShell"></div>
  <main class="wrap">
    <h1 style="margin:0;">Ignition Tag Mapping</h1>
    <p class="small">Default direction P6 → Ignition, read-only. Bidirectional requires explicit env allowlist.</p>
    <div style="display:flex;gap:0.5rem;margin:1rem 0;">
      <button id="propose" type="button">Propose from P6 signals</button>
      <button id="udt" type="button">UDT proposal</button>
      <button id="reload" type="button">Reload</button>
    </div>
    <pre id="out" class="small" style="background:#f6f8f7;padding:1rem;border:1px solid #ddd;white-space:pre-wrap;"></pre>
  </main>
  <script src="ui.js"></script>
  <script src="app_shell.js"></script>
  <script>
    const out = document.getElementById("out");
    async function load() {
      const r = await fetch("/api/connect/tag-map"); out.textContent = JSON.stringify(await r.json(), null, 2);
    }
    document.getElementById("reload").onclick = load;
    document.getElementById("propose").onclick = async () => {
      const r = await fetch("/api/connect/tag-map/propose", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
      out.textContent = JSON.stringify(await r.json(), null, 2);
    };
    document.getElementById("udt").onclick = async () => {
      const r = await fetch("/api/connect/udt-proposal"); out.textContent = JSON.stringify(await r.json(), null, 2);
    };
    load();
  </script>
</body>
</html>
