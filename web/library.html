<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>P6 Equipment Library</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="site.css" />
  <link rel="stylesheet" href="app_shell.css" />
  <link rel="stylesheet" href="ui.css" />
</head>
<body data-app-active="library">
  <div id="appShell"></div>
  <main class="wrap">
    <h1 style="margin:0;">Virtual Equipment Library</h1>
    <p class="small">Reusable simulation models: signals, states, timing, failure behavior.</p>
    <pre id="out" class="small" style="background:#f6f8f7;padding:1rem;border:1px solid #ddd;white-space:pre-wrap;"></pre>
  </main>
  <script src="ui.js"></script>
  <script src="app_shell.js"></script>
  <script>
    fetch("/api/equipment/library").then(r=>r.json()).then(d=>{
      document.getElementById("out").textContent = JSON.stringify(d, null, 2);
    });
  </script>
</body>
</html>
