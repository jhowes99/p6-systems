<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Sequencing — Axiom Verify</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="site.css" />
    <link rel="stylesheet" href="app_shell.css" />
    <style>
      .card { border:1px solid #ddd; border-radius: 12px; padding: 14px; background:#fff; }
      .row { display:flex; gap: 10px; flex-wrap: wrap; align-items:center; }
      .btn { display:inline-block; padding:10px 12px; border-radius: 10px; border:1px solid #111; background:#111; color:#fff; cursor:pointer; }
      .btn.secondary { background:#fff; color:#111; }
      .steps { display:grid; gap: 10px; margin-top: 12px; }
      .step { border:1px dashed #ddd; border-radius: 12px; padding: 10px; background:#fafafa; display:flex; gap: 10px; align-items:center; flex-wrap: wrap; }
      input, select { padding: 8px; border:1px solid #ddd; border-radius: 8px; }
      .small { font-size: 12px; color:#444; }
      pre { background:#f7f7f7; padding:10px; border:1px solid #ddd; border-radius: 10px; overflow:auto; }
    </style>
  </head>
  <body data-app-active="timeline">
    <div id="appShell"></div>

    <main class="wrap">
      <h1>Sequencing</h1>
      <p class="small">Build a visible sequence of events. Timers are generated automatically under the hood.</p>

      <div class="card">
        <div class="row">
          <label>Start input name</label>
          <input id="startTag" value="Start Button" />
          <button class="btn secondary" id="addAction">Add Action</button>
          <button class="btn secondary" id="addDelay">Add Delay</button>
          <button class="btn" id="compile">Generate + Upload</button>
        </div>

        <div id="steps" class="steps"></div>
        <div id="msg" class="small" style="margin-top:10px;"></div>
        <pre id="preview"></pre>
      </div>
    </main>

    <script src="app_shell.js"></script>
    <script src="timeline.js"></script>
  </body>
</html>
