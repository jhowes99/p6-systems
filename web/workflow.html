<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Workflow — P6 Systems</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="site.css" />
    <link rel="stylesheet" href="app_shell.css" />
    <link rel="stylesheet" href="ui.css" />
    <style>
      .workflowGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin-top: 20px; }
      .workflowCard { border: 1px solid rgba(15,23,42,.12); border-radius: 12px; padding: 16px; background: #fff; text-decoration: none; color: inherit; display: block; transition: box-shadow 0.2s; }
      .workflowCard:hover { box-shadow: 0 4px 12px rgba(0,0,0,.08); }
      .workflowCard h3 { margin: 0 0 8px 0; font-size: 16px; }
      .workflowCard .badge { margin-top: 8px; }
      .workflowCard .small { margin-top: 6px; color: #64748b; font-size: 12px; }
    </style>
  </head>
  <body data-app-active="workflow">
    <div id="appShell"></div>

    <main class="wrap page">
      <div class="page-header">
        <div class="page-breadcrumb">Home</div>
        <h1 class="page-title">Workflow</h1>
        <p class="page-subtitle">Commissioning steps — follow in order or jump to any step.</p>
      </div>

      <div id="workflowCards" class="workflowGrid"></div>
    </main>

    <script src="app_shell.js"></script>
    <script src="ui.js"></script>
    <script src="workflow.js"></script>
  </body>
</html>
